# DS14: projectiles fired by anomaly-core powered weapons (WeaponAnomalyCondenser).
# Each projectile corresponds 1:1 to one of the AnomalyCore* prototypes from
# Resources/Prototypes/Entities/Structures/Specific/Anomaly/cores.yml

# --- Pyroclastic: burning shard, sets the target on fire ---
- type: entity
  id: AnomalyCoreBulletPyroclastic
  name: pyroclastic shard
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
      color: "#E25822"
  - type: PointLight
    enabled: true
    color: "#E25822"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Heat: 12
  - type: IgniteOnCollide
    fireStacks: 1.5

# --- Electricity: arcing bolt, stuns and knocks down ---
- type: entity
  id: AnomalyCoreBulletElectricity
  name: electrified bolt
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Reflective
    reflective:
    - Energy
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: spark
      shader: unshaded
      color: "#ffffaa"
  - type: PointLight
    enabled: true
    color: "#ffffaa"
    radius: 2.0
    energy: 5.0
  - type: Projectile
    damage:
      types:
        Shock: 6
    soundHit:
      path: "/Audio/Weapons/Guns/Hits/taser_hit.ogg"
    forceSound: true
  - type: StunOnCollide
    stunAmount: 2
    knockdownAmount: 3
    slowdownAmount: 3
    walkSpeedModifier: 0.6
    sprintSpeedModifier: 0.6

# --- Ice: frigid sliver, chills and slows but does not knock down ---
- type: entity
  id: AnomalyCoreBulletIce
  name: frigid sliver
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
      color: "#befaff"
  - type: PointLight
    enabled: true
    color: "#befaff"
    radius: 1.5
    energy: 3.0
  - type: Projectile
    damage:
      types:
        Cold: 10
  - type: StunOnCollide
    stunAmount: 0
    knockdownAmount: 0
    slowdownAmount: 3
    walkSpeedModifier: 0.5
    sprintSpeedModifier: 0.5
    drop: false

# --- Gravity: collapses into a small singularity-like blast on impact ---
- type: entity
  id: AnomalyCoreBulletGravity
  name: gravitic collapse charge
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/projectiles2.rsi
    layers:
    - state: bullet
      shader: unshaded
      color: "#1e070e"
  - type: PointLight
    enabled: true
    color: "#1e070e"
    radius: 2.5
    energy: 8.0
  - type: Projectile
    damage:
      types:
        Blunt: 4
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 25
    intensitySlope: 5
    maxIntensity: 10
    tileBreakScale: 0
    canCreateVacuum: false

# --- Rock: dense kinetic slug, ignores armor ---
- type: entity
