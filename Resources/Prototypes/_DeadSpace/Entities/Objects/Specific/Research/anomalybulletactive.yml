  - type: PointLight
    enabled: true
    color: "#8ff2ff"
    radius: 2.5
    energy: 6.0
  - type: Projectile
    damage:
      types:
        Cold: 20
  - type: StunOnCollide
    stunAmount: 2
    knockdownAmount: 2
    slowdownAmount: 4
    walkSpeedModifier: 0.4
    sprintSpeedModifier: 0.4
