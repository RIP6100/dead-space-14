# DS14: projectiles fired by AnomalyCoreAmmoProvider when an ACTIVE (non-decayed) anomaly core is loaded.
# These are deliberately stronger/more unique than their Inert counterparts (see anomaly_core_projectiles.yml) -
# while the core is still alive it grants free, unlimited shots, so the payoff for using a live core is a
# more dangerous, more interesting shot. Once the core naturally decays into its Inert form, the weapon falls
# back to the weaker, charge-limited Inert projectiles.

# --- Pyroclastic (active): true fireball, explodes and ignites everything nearby ---
- type: entity
  id: AnomalyCoreBulletPyroclasticActive
  name: pyroclastic fireball
  parent: BaseBulletTrigger
  categories: [ HideSpawnMenu ]
  components:
  - type: Sprite
    sprite: Objects/Weapons/Guns/Projectiles/magic.rsi
    layers:
    - state: fireball
      shader: unshaded
  - type: PointLight
    enabled: true
    color: "#E25822"
    radius: 3.0
    energy: 6.0
  - type: Projectile
    damage:
      types:
        Heat: 18
  - type: ExplodeOnTrigger
  - type: Explosive
    explosionType: Default
    totalIntensity: 60
    intensitySlope: 4
    maxIntensity: 15
    tileBreakScale: 0
    canCreateVacuum: false
  - type: IgnitionSource
    temperature: 500
    ignited: true
  - type: IgniteOnCollide
    fireStacks: 2.5

# --- Electricity (active): true tesla arc - embeds and chains lightning to nearby targets ---
- type: entity
  id: AnomalyCoreBulletElectricityActive
  name: tesla arc
  parent: BaseBullet
  categories: [ HideSpawnMenu ]
  components:
  - type: TimedDespawn
    lifetime: 5
  - type: Sprite
    sprite: Structures/Power/Generation/Tesla/energy_miniball.rsi
    layers:
    - state: tesla_projectile
      shader: unshaded
  - type: PointLight
    enabled: true
    color: "#ffffaa"
    radius: 2.5
    energy: 6.0
  - type: StaminaDamageOnCollide
    damage: 45
  - type: EmbeddableProjectile
  - type: Projectile
    damage:
      types:
        Shock: 4
    deleteOnCollide: false
    soundHit:
      path: /Audio/Weapons/Guns/Hits/bullet_hit.ogg
  - type: LightningArcShooter
    arcDepth: 2
    maxLightningArc: 3
    shootMinInterval: 2.0
    shootMaxInterval: 3.5
    shootRange: 5
    lightningPrototype: Lightning
  - type: Electrified
    requirePower: false
  - type: Tag
    tags:
    - HideContextMenu

# --- Ice (active): violent cryogenic burst - freezes and knocks down on top of heavy cold damage ---
- type: entity
