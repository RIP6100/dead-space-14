- type: entity
  parent: BaseItem
  id: ResearchDataDiskBase
  abstract: true
  name: диск данных
  description: Жёсткий диск с измерительными и теоретическими данными. Учёные явно не будут в восторге, если вы его украдёте.
  components:
  - type: Sprite
    sprite: Objects/Misc/module.rsi
    state: harddisk
  - type: ResearchDataDisk
  - type: EmitSoundOnPickup
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_pickup.ogg
  - type: EmitSoundOnDrop
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_drop.ogg
  - type: EmitSoundOnLand
    sound:
      path: /Audio/_DeadSpace/Items/Handing/disk_drop.ogg

- type: entity
  parent: PaperArtifactAnalyzer
  id: ResearchPrintoutBase
  abstract: true
  name: исследовательский отчёт
  description: Матричная распечатка с теоретической выкладкой одного исследования. Вставляется в консоль теоретической разработки.
  components:
  - type: ResearchPrintout
  - type: UserInterface
    interfaces:
      enum.PaperUiKey.Key:
        type: ResearchPrintoutBoundUserInterface
      enum.PaperUiKey.Write:
        type: ResearchPrintoutBoundUserInterface
  - type: PaperVisuals
    maxWritableArea: 520.0, 0.0

- type: entity
  parent: ResearchDataDiskBase
  id: ResearchDataDiskEmpty
  suffix: пустой

- type: entity
  parent: ResearchPrintoutBase
  id: ResearchPrintout
  suffix: пустая

