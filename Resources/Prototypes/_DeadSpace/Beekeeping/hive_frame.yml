- type: entity
  id: HiveFrame
  name: рамка для пасеки
  description: Специальная рамка для пасеки, в которой пчёлы строят соты.
  components:
  - type: Sprite
    sprite: _DeadSpace/Beekeeping/hiveframe.rsi
    layers:
    - state: empty
      map: ["enum.HiveFrameVisualLayers.Base"]
  - type: Item
    size: Normal
  - type: HiveFrame
    maxCapacity: 50
  - type: Clickable
  - type: InteractionOutline
  - type: Appearance
  - type: GenericVisualizer
    visuals:
      enum.HiveFrameVisuals.HasHoneycomb:
        enum.HiveFrameVisualLayers.Base:
          True: { state: full }
          False: { state: empty }