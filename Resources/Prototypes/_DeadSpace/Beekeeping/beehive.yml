- type: entity
  id: BeeHive
  name: пчелиная пасека
  description: Деревянная пасека. Пчёлы живут в ней, делая воск и мёд для ваших странных нужд.
  components:
  - type: Clickable 
  - type: Sprite
    sprite: _DeadSpace/Beekeeping/beehive.rsi
    state: idle
  - type: BeeHive
    pollenPerHoney: 10
    waxPerHoney: 0.5
    productionInterval: 10
    maxFrames: 6
  - type: Transform
    anchored: true
  - type: Storage
    grid:
    - 0,0,3,1
    - 0,2,3,3
    - 0,4,3,5
    maxItemSize: Normal
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35" # DS14
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Appearance
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: StructuralInorganic

- type: entity
  id: BeeHive
  name: beehive-name
  description: beehive-desc
  components:
  - type: Sprite
    sprite: _DeadSpace/Beekeeping/beehive.rsi
    state: idle
  - type: BeeHive
    pollenPerHoney: 10
    waxPerHoney: 0.5
    productionInterval: 10
    maxFrames: 6
  - type: Storage
    grid:
    - 0,0,2,1
    - 0,2,2,3
    - 0,4,2,5
    maxItemSize: Normal
  - type: Clickable
  - type: InteractionOutline
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.45,-0.45,0.45,0.45"
        density: 55
        mask:
        - TableMask
        layer:
        - TableLayer
  - type: Physics
    bodyType: Static