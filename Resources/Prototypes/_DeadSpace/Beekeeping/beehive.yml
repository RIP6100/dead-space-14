- type: entity
  id: BeeHive
  name: пчелиная пасека
  description: Деревянная пасека. Пчёлы живут в ней, делая воск и мёд для ваших странных нужд.
  components:
  - type: Clickable
  - type: Sprite
    sprite: _DeadSpace/Beekeeping/beehive.rsi
    state: idle
  - type: BeeHive
    pollenPerHoney: 10
    productionInterval: 15
    maxBees: 3
    spawnInterval: 15
  # Слот для матки. Улей работает только когда матка вставлена.
  - type: ItemSlots
    slots:
      queen_slot:
        name: Матка
        whitelist:
          components:
          - QueenBee
        insertSound: /Audio/Effects/Fluids/splat.ogg
  - type: Transform
    anchored: true
  - type: Storage
    grid:
    - 0,0,3,1
    - 0,2,3,3
    - 0,4,3,5
    maxItemSize: Normal
  - type: UserInterface
    interfaces:
      enum.StorageUiKey.Key:
        type: StorageBoundUserInterface
  - type: UseDelay
    delay: 0.5
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.25,-0.35,0.25,0.35" # DS14
        density: 190
        mask:
        - MachineMask
        layer:
          - MachineLayer
  - type: Physics
    bodyType: Static
  - type: Destructible
    thresholds:
    - trigger:
        !type:DamageTrigger
        damage: 100
      behaviors:
        - !type:DoActsBehavior
          acts: [ "Destruction" ]
    - trigger:
        !type:DamageTrigger
        damage: 50
      behaviors:
      - !type:DoActsBehavior
        acts: ["Destruction"]
  - type: Appearance
  - type: InteractionOutline
  - type: Damageable
    damageModifierSet: Wood
    damageContainer: StructuralInorganic